<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GBSEC - Daily Cyber Drill</title>
  <link rel="stylesheet" href="styles/shared.css">
  <link rel="stylesheet" href="styles/newtab.css">
</head>
<body>
  <div id="dashboard">
    <div id="header-stats">
      <div class="pill flame">🔥 <span id="streak-count">0</span></div>
      <div class="pill gem">💎 <span id="gem-count">0</span> XP</div>
      <div class="pill level" id="level-name">Lvl 1: Recruit</div>
    </div>

    <div class="container">
      <div id="drill-container" class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <span id="drill-progress" style="color: var(--accent-primary); font-weight: bold; font-size: 0.9rem;">Question 1 of 10</span>
        </div>
        <div class="scenario-header">
          <div class="meta-header">
            <span id="threat-type">Threat Type: BEC</span>
            <span id="threat-date"></span>
          </div>
          <h2 id="threat-topic">Loading Scenario...</h2>
          <div class="email-body">
            <div id="threat-sender"></div>
            <div id="threat-subject"></div>
            <br>
            <div id="threat-snippet"></div>
          </div>
          <div class="meta-header">
            <span id="threat-context"></span>
          </div>
        </div>

        <div class="decision-grid" id="options-container">
          <!-- Options injected here -->
        </div>

        <div id="explanation-drawer" style="display: none; text-align: center; margin-top: 1rem;">
          <div id="confetti-anchor"></div>
          <h3 id="feedback-title" style="margin-top: 0; font-size: 1.5rem;"></h3>
          <p id="feedback-text" style="color: var(--text-secondary); margin-bottom: 1.5rem;"></p>
          <button id="close-drill-btn" class="primary-btn">Next Question</button>
        </div>
      </div>

      <div id="cooldown-container" class="card" style="display: none; text-align: center;">
        <div class="icon-shield" style="font-size: 4rem; margin-bottom: 1rem;">⏳</div>
        <h2 style="margin-top: 0;">System Analyzing...</h2>
        <p style="color: var(--text-secondary);">You've completed your latest security drill batch. The next batch will be available in:</p>
        <div id="countdown-timer" style="font-size: 3rem; font-weight: bold; margin: 2rem 0; color: var(--accent-primary); font-variant-numeric: tabular-nums;">--:--:--</div>
        <button id="cooldown-close-btn" class="primary-btn">Back to Work</button>
      </div>
    </div>
  </div>

  <script src="lib/confetti.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
